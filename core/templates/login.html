<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Laboratorio UNCP</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .errorlist { color: red; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Acceso Laboratorio</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">{{ form.username.label_tag }} {{ form.username }} {{ form.username.errors }}</div>
            <div class="form-group">{{ form.password.label_tag }} {{ form.password }} {{ form.password.errors }}</div>
            <button type="submit" class="btn">Ingresar</button>
        </form>
    </div>
</body>
</html>
